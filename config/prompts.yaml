ftp: 250  # Default FTP for all prompts (watts)

prompts:
  - id: endurance_65_sprints
    description: "Endurance ride with short sprints"
    user_prompt: "A 60-minute endurance ride at around 65% of FTP, kept cadence between 85 and 95 rpm, and threw in a few short 10-second sprints just to wake up the legs."

  - id: threshold_intervals_3x10
    description: "Classic threshold intervals with warmup/cooldown"
    user_prompt: "15min warm-up, 3x10min @ 90% FTP with 5min easy between, 10min cool-down."

  - id: threshold_4x8_detailed
    description: "Threshold intervals with detailed instructions"
    user_prompt: "Start with 20 minutes of easy spinning, then complete 4 intervals of 8 minutes at threshold power with 4 minutes recovery between each. Finish with 10 minutes of light spinning."

  - id: two_hour_tempo_climbing
    description: "Long ride with tempo and climbing"
    user_prompt: "Two-hour ride, steady tempo for the first hour, moderate climbing in the second, staying below threshold."

  - id: mixed_zones_progression
    description: "Progressive workout through multiple zones"
    user_prompt: "Z2 endurance for 45 minutes, Z3 tempo for 20 minutes, 3x2min Z5 VO₂max efforts, finish with 10min Z1 recovery."

  - id: group_ride_surges
    description: "Variable intensity group ride simulation"
    user_prompt: "Fast group ride — started easy for 15 min, then about 40 min of surging between Z3 and Z6 depending on hills and sprints, then 10 min spin home."

  - id: zwift_intervals_sprints
    description: "Zwift-style workout with intervals and sprints"
    user_prompt: "Zwift workout: 5min warmup ramp, 3x12min at 95% FTP with 5min recoveries, then 4x30sec sprints at 150% FTP, 5min cooldown."

  - id: zwift_complex_progressive_blocks
    description: "Complex workout with multiple progressive blocks"
    user_prompt: |
      5min from 30 to 70% FTP
      20sec @ 80% FTP
      20sec @ 100% FTP
      20sec @ 120% FTP
      3min @ 50% FTP
      3min @ 110% FTP
      2min @ 120% FTP
      6min @ 50% FTP
      20min free ride
      5min from 50 to 30% FTP

  - id: shorthand_notation
    description: "Workout using shorthand notation"
    user_prompt: "WU 10min @150W, 6×5min @300W with 3 min rec @120W, cd 20 min @Z1."

  - id: simple_tempo_block
    description: "Simple tempo block workout"
    user_prompt: "10-minute warmup, then main set of 40 minutes at tempo, then cooldown 10 minutes."

  - id: threshold_5x6
    description: "Threshold intervals 5x6 minutes"
    user_prompt: "10-minute easy spin warmup, then main set of 5x6-minute threshold intervals with 3 minutes recovery between each, finishing with 10-minute cooldown."

  - id: ramping_intervals
    description: "Intervals ramping from 85% to 100% FTP"
    user_prompt: "10-minute warmup, main set of 4x10-minute intervals ramping from 85% to 100% FTP with 3 minutes recovery at Z1, ending with 15 minutes easy spinning."

  - id: tempo_sprints_combo
    description: "Tempo work combined with sprint intervals"
    user_prompt: "5-minute warmup, main set of 20 minutes steady Z3, followed by 6x20-second sprints with 40 seconds rest, cooldown 10 minutes."

  - id: progressive_blocks
    description: "Progressive Z2 to Z3 blocks"
    user_prompt: "Warmup 10 minutes, main set first block 15 minutes Z2, second block 15 minutes Z3, 5-minute recovery between, 10-minute cooldown."

  - id: threshold_sprints_shorthand
    description: "Threshold work with sprint finisher (shorthand)"
    user_prompt: "WU 10min @60% FTP, 3x12min @95% FTP (5min @Z1 rec), 5x30s @150% FTP / 30s easy, 10min CD."

  - id: climbing_intervals_wattage
    description: "Climbing intervals with specific wattage"
    user_prompt: "WU 15min @150W, 5x6min @310→320W on 3% climb / 3min easy spin, CD 10min Z1."

  - id: progressive_ftp_percentage
    description: "Progressive intervals by FTP percentage"
    user_prompt: "WU 10min Z2, 4x10min progressing 85→100% FTP (3min Z1 between), CD 15min easy."

  - id: simple_threshold_60min
    description: "Simple threshold workout request"
    user_prompt: "Create a 60 minute threshold workout."

  - id: warmup_15min
    description: "15 min WU"
    user_prompt: "Create a warm-up for which I can do before my time trial"

  - id: fartlek
    description: "Fartlek 2 hours"
    user_prompt: "Create a 2 hour fartlek workout."

  - id: low_cadence_strength
    description: "Low cadence strength intervals"
    user_prompt: |
      Warmup
      - 20m 60% 90-100rpm

      Main set 6x
      - 4m 100% 40-50 rpm, power is less important than getting the torque
      - 5m recovery at 40%

      Cooldown
      - 20m 60% 90-100rpm

  - id: over_under_classic
    description: "Classic over/under intervals"
    user_prompt: "10-minute warmup, then 8x(2min @ 105% FTP / 1min @ 95% FTP) continuous without rest between, finish with 10-minute cooldown."

  - id: ascending_pyramid_threshold
    description: "Ascending pyramid at threshold"
    user_prompt: "15min warmup, then ascending ladder: 3-4-5-6min @ 90% FTP with 2-minute easy recovery between each interval, 15min cooldown."

  - id: ascending_descending_pyramid
    description: "Combined ascending and descending pyramid"
    user_prompt: "10min warmup, ascending: 3-4-5min @ 90% FTP with 2min recovery, then descending: 5-4-3min @ 95% FTP with 2min recovery, 15min cooldown."

  - id: descending_pyramid_threshold
    description: "Descending pyramid at high threshold"
    user_prompt: "Warmup 15 minutes, main set descending intervals: 6-5-4-3min @ 95% FTP with 3 minutes Z1 between each, cooldown 10 minutes."

  - id: tempo_time_window
    description: "Tempo block using time markers"
    user_prompt: "60-minute ride. Easy spinning for first 15 minutes. From 15:00-45:00, maintain tempo at 80% FTP. Last 15 minutes easy cooldown."

  - id: sweet_spot_blocks_2to1_explanation
    description: "Sweet spot intervals with 2:1 work to rest"
    user_prompt: "Warmup 10min, main set 3x20min sweet spot (88-93% FTP) with 10min easy recovery between using 2:1 work-to-rest ratio, cooldown 10min."

  - id: sweet_spot_blocks_no_explanation
    description: "Sweet spot intervals simple"
    user_prompt: "Warmup 10min, main set 3x20min sweet spot with 10min easy recovery, cooldown 20min."

  - id: sweet_spot_2to1_ratio
    description: "Sweet spot using strict 2:1 ratio"
    user_prompt: "Warmup 10 minutes. Main set: 4x16min @ 90% FTP with 8min recovery (2:1 work to rest). Cooldown 10 minutes."

  - id: fractional_vo2max_efforts
    description: "VO2max efforts using fractional time"
    user_prompt: "10-minute warmup, then 4x90 seconds @ 120% FTP with 90 seconds recovery at 50% FTP, 10-minute cooldown."

  - id: tabata_sprints_explained
    description: "Tabata protocol sprint intervals"
    user_prompt: "15min warmup, then Tabata protocol: 8 rounds of 20 seconds all-out sprint / 10 seconds easy recovery (total 4 minutes), 5min easy, repeat Tabata set one more time, 10min cooldown."

  - id: tabata_sprints_no_explanation
    description: "Tabata protocol not explained"
    user_prompt: "15min warmup, then 3 Tabata sets with 5min easy in between, 10min cooldown."

  - id: mixed_tabata_sweet_spot
    description: "Tabata followed by sweet spot"
    user_prompt: "15min WU, Tabata: 8×20sec all-out / 10sec easy, 10min Z2 recovery, then 2x15min sweet spot @ 88% FTP with 7.5min recovery (2:1 ratio), 10min CD."

  - id: ronnestad_different
    description: "Ronnestad intervals for anaerobic capacity"
    user_prompt: "20min warmup, main set Ronnestad intervals: 13x30 seconds @ 200-250% FTP with 15 seconds active recovery at 50% FTP, 3min easy, repeat set again, 15min cooldown."

  - id: ronnestad_no_explanation
    description: "Double Ronnestad sets with sweet spot between"
    user_prompt: "20min WU, 1 Ronnestad. Then 15min CD."

  - id: ronnestad_tripe_set_no_explanation
    description: "Double Ronnestad sets with sweet spot between"
    user_prompt: "20min WU, 3 Ronnestad sets with 5 min of recovery in between, 15min CD."

  - id: sweet_spot_progression_time_based
    description: "Sweet spot with time-based progression"
    user_prompt: "Start at minute 0:00 with 10min easy. At 10:00 begin first sweet spot block of 15min @ 90% FTP. At 28:00 start 5min recovery. At 33:00 begin second sweet spot block of 20min @ 90% FTP. Finish with cooldown from 53:00-65:00."

  - id: over_under_sweet_spot
    description: "Over/under in sweet spot range"
    user_prompt: "WU 15min, 6x(3min @ 92% FTP / 2min @ 88% FTP) continuous over/under in sweet spot zone, CD 10min."

  - id: fractional_threshold_2to1
    description: "Fractional time threshold with 2:1 ratio"
    user_prompt: "10min warmup, 5x90 seconds @ 105% FTP with 45 seconds easy (2:1 work-to-rest), 5min recovery, then 3x2.5min @ 100% FTP with 75 seconds recovery, 10min cooldown."

  - id: tempo_window_over_under
    description: "Tempo time window with over/under finish"
    user_prompt: "75min total. From 0:00-15:00 easy warmup. From 15:00-50:00 steady tempo @ 78% FTP. From 50:00-62:00 over/under: 4x(2min @ 105% / 1min @ 95%). From 62:00-75:00 cooldown."