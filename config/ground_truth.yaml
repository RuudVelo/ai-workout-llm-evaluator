# Ground Truth Generation Configuration
# This defines which model to use as the "reference" for creating ground truth workouts

reference_model:
  provider: openai
  model_id: gpt-4o
  display_name: "GPT-4o (Reference)"

  # Alternative options:
  # provider: gemini
  # model_id: gemini-1.5-pro

  # provider: openai
  # model_id: gpt-4-turbo

# Generation settings
generation:
  # Number of attempts if generation fails
  max_retries: 3

  # Whether to overwrite existing ground truth files
  overwrite_existing: false

  # Whether to validate ground truth before saving
  validate_before_saving: true

# Optional: Manually curated ground truth files take precedence
# If a ground truth file already exists for a prompt_id, it won't be regenerated
# unless overwrite_existing is true

# Evaluation settings - specify which run directories to use
evaluation:
  # Which ground truth run to evaluate/use for quality assessment
  # Example: "run_20251104_145118" or "latest" to use the most recent run
  ground_truth_run: "latest"

  # Which evaluation results run to use for model comparisons (for future use)
  # Example: "run_20251104_150000" or "latest" to use the most recent run
  evaluation_results_run: "latest"
